name: PRODUCTION UI FDE Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_TAG: 1.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Login to DockerHub Registry
        run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Build Docker Compose image
        run: docker compose -f docker-compose-prod.yml up --build -d

      - name: Push to Docker Hub
        run: docker push cliniq360/vaani-ui-school:${{ env.IMAGE_TAG }}

  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    environment: production
    steps:
      - name: Deploy to EC2
        run: |
          # Save the private key to a file
          echo "${{ secrets.EC2_SSH_KEY }}" > vaani-ec2.pem
          chmod 400 vaani-ec2.pem

          # SSH into the EC2 instance and deploy the Docker image
          ssh -o StrictHostKeyChecking=no -i vaani-ec2.pem ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
          cd /home/ec2-user/eigi-fde
          git checkout main
          git fetch -p
          git pull origin main
          export IMAGE_TAG=${{ env.IMAGE_TAG }}
          docker-compose -f docker-compose-prod.yml up -d
          docker image prune -af
          EOF
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
