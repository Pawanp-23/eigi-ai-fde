# Local development: Vite dev server with HMR against the bind-mounted source.
#   docker compose up --build      -> http://localhost:5173
# For a local check of the production image instead, use docker-compose-prod.yml.
name: eigi-fde

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: eigi-fde-dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      # Live source for HMR. The named volume keeps the container's Linux
      # node_modules from being shadowed by the host's.
      - .:/app
      - eigi-fde-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
    restart: "no"

volumes:
  eigi-fde-node-modules:
